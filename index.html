    <!-- Critical CSS inlined for performance -->
    <style>
      /* Critical above-the-fold styles */
      body {
        font-family: "Inter", system-ui, sans-serif;
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Loading state */
      .loading {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      }

      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #e2e8f0;
        border-top: 4px solid #00a8e8;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      /* Accessibility improvements */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* High contrast mode support */
      @media (prefers-contrast: high) {
        :root {
          --tuggi-primary: #0056b3;
          --tuggi-secondary: #cc5500;
        }
      }

      /* Focus visible for accessibility */
      .focus-visible {
        outline: 2px solid #00a8e8;
        outline-offset: 2px;
      }
    </style>

  <body>
    <!-- Skip to main content for accessibility -->

      href="#main-content"
      class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 bg-tuggi-primary text-white px-4 py-2 rounded-lg z-50"
    >
      Skip to main content
    </a>

    <!-- Loading state -->
    <div id="loading" class="loading">
      <div class="loading-spinner" aria-label="Loading"></div>
    </div>

    <!-- Main app container -->
    <div id="root" style="display: none"></div>

    <!-- Performance monitoring script -->
    <script>
      // Performance monitoring with multilingual context
      if ("performance" in window) {
        window.addEventListener("load", function () {
          // Hide loading, show app
          document.getElementById("loading").style.display = "none";
          document.getElementById("root").style.display = "block";

          // Track performance metrics with language context
          setTimeout(function () {
            if (window.gtag) {
              const perfData =
                performance.getEntriesByType("navigation")[0];
              const currentLanguage =
                window.location.pathname.split("/")[1] || "en";
              const language = currentLanguage === "pt"
                ? "PT"
                : currentLanguage === "es"
                ? "ES"
                : "EN";

              if (perfData) {
                window.gtag("event", "page_load_performance", {
                  event_category: "Performance",
                  load_time: Math.round(
                    perfData.loadEventEnd - perfData.navigationStart,
                  ),
                  dom_content_loaded: Math.round(
                    perfData.domContentLoadedEventEnd -
                      perfData.navigationStart,
                  ),
                  first_paint: Math.round(
                    performance.getEntriesByType("paint")[0]
                      ?.startTime || 0,
                  ),
                  page_type: "home",
                  language: language,
                  locale: language === "PT"
                    ? "pt-BR"
                    : language === "ES"
                    ? "es-ES"
                    : "en-US",
                });
              }
            }
          }, 1000);
        });
      }

      // Error tracking with multilingual context
      window.addEventListener("error", function (e) {
        if (window.gtag) {
          const currentLanguage =
            window.location.pathname.split("/")[1] || "en";
          const language = currentLanguage === "pt"
            ? "PT"
            : currentLanguage === "es"
            ? "ES"
            : "EN";

          window.gtag("event", "javascript_error", {
            event_category: "Error",
            event_label: e.message,
            error_file: e.filename,
            error_line: e.lineno,
            language: language,
            locale: language === "PT"
              ? "pt-BR"
              : language === "ES"
              ? "es-ES"
              : "en-US",
          });
        }
      });

      // Unhandled promise rejection tracking with multilingual context
      window.addEventListener("unhandledrejection", function (e) {
        if (window.gtag) {
          const currentLanguage =
            window.location.pathname.split("/")[1] || "en";
          const language = currentLanguage === "pt"
            ? "PT"
            : currentLanguage === "es"
            ? "ES"
            : "EN";

          window.gtag("event", "promise_rejection", {
            event_category: "Error",
            event_label: e.reason?.message ||
              "Unknown promise rejection",
            language: language,
            locale: language === "PT"
              ? "pt-BR"
              : language === "ES"
              ? "es-ES"
              : "en-US",
          });
        }
      });

      // Language detection and redirect (SEO content is pre-rendered at build time)
      (function () {
        const currentPath = window.location.pathname;
        const pathSegments = currentPath.split("/").filter(Boolean);
        const supportedLangs = ["pt", "en", "es", "fr", "de", "it"];

        // If no language in URL, redirect to appropriate language
        if (
          pathSegments.length === 0 ||
          !supportedLangs.includes(pathSegments[0])
        ) {
          const browserLang = navigator.language.toLowerCase();
          let targetLang = "en"; // default

          if (browserLang.startsWith("pt")) targetLang = "pt";
          else if (browserLang.startsWith("es")) targetLang = "es";
          else if (browserLang.startsWith("fr")) targetLang = "fr";
          else if (browserLang.startsWith("de")) targetLang = "de";
          else if (browserLang.startsWith("it")) targetLang = "it";

          // Check for stored language preference
          const storedLang = localStorage.getItem(
            "tuggi_preferred_language",
          );
          if (storedLang) {
            const langMap = {
              "PT": "pt",
              "EN": "en",
              "ES": "es",
              "FR": "fr",
              "DE": "de",
              "IT": "it",
            };
            targetLang = langMap[storedLang] || targetLang;
          }

          // Redirect to localized URL
          const newPath = `/${targetLang}/${pathSegments.join("/")}`;
          if (newPath !== currentPath) {
            window.history.replaceState(null, "", newPath);
          }
        }
      })();
    </script>
