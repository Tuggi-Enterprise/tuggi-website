    <!-- Critical CSS inlined for performance -->
    <style>
      /* Critical above-the-fold styles */
      body {

        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;

      /* Loading state */
      .loading {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      }
      
      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #e2e8f0;
        border-top: 4px solid #00A8E8;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      /* Accessibility improvements */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
      
      /* High contrast mode support */
      @media (prefers-contrast: high) {
        :root {
          --tuggi-primary: #0056b3;
          --tuggi-secondary: #cc5500;
        }
      }
      
      /* Focus visible for accessibility */
      .focus-visible {
        outline: 2px solid #00A8E8;
        outline-offset: 2px;
      }

  <body>
    <!-- Skip to main content for accessibility -->
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 bg-tuggi-primary text-white px-4 py-2 rounded-lg z-50">
      Skip to main content
    </a>
    
    <!-- Loading state -->
    <div id="loading" class="loading">
      <div class="loading-spinner" aria-label="Loading"></div>
    </div>
    
    <!-- Main app container -->
    <div id="root" style="display: none;"></div>
    
    <!-- Performance monitoring script -->
    <script>
      // Performance monitoring with multilingual context
      if ('performance' in window) {
        window.addEventListener('load', function() {
          // Hide loading, show app
          document.getElementById('loading').style.display = 'none';
          document.getElementById('root').style.display = 'block';
          
          // Track performance metrics with language context
          setTimeout(function() {
            if (window.gtag) {
              const perfData = performance.getEntriesByType('navigation')[0];
              const currentLanguage = window.location.pathname.split('/')[1] || 'en';
              const language = currentLanguage === 'pt' ? 'PT' : currentLanguage === 'es' ? 'ES' : 'EN';
              
              if (perfData) {
                window.gtag('event', 'page_load_performance', {
                  event_category: 'Performance',
                  load_time: Math.round(perfData.loadEventEnd - perfData.navigationStart),
                  dom_content_loaded: Math.round(perfData.domContentLoadedEventEnd - perfData.navigationStart),
                  first_paint: Math.round(performance.getEntriesByType('paint')[0]?.startTime || 0),
                  page_type: 'home',
                  language: language,
                  locale: language === 'PT' ? 'pt-BR' : language === 'ES' ? 'es-ES' : 'en-US'
                });
              }
            }
          }, 1000);
        });
      }
      
      // Error tracking with multilingual context
      window.addEventListener('error', function(e) {
        if (window.gtag) {
          const currentLanguage = window.location.pathname.split('/')[1] || 'en';
          const language = currentLanguage === 'pt' ? 'PT' : currentLanguage === 'es' ? 'ES' : 'EN';
          
          window.gtag('event', 'javascript_error', {
            event_category: 'Error',
            event_label: e.message,
            error_file: e.filename,
            error_line: e.lineno,
            language: language,
            locale: language === 'PT' ? 'pt-BR' : language === 'ES' ? 'es-ES' : 'en-US'
          });
        }
      });
      
      // Unhandled promise rejection tracking with multilingual context
      window.addEventListener('unhandledrejection', function(e) {
        if (window.gtag) {
          const currentLanguage = window.location.pathname.split('/')[1] || 'en';
          const language = currentLanguage === 'pt' ? 'PT' : currentLanguage === 'es' ? 'ES' : 'EN';
          
          window.gtag('event', 'promise_rejection', {
            event_category: 'Error',
            event_label: e.reason?.message || 'Unknown promise rejection',
            language: language,
            locale: language === 'PT' ? 'pt-BR' : language === 'ES' ? 'es-ES' : 'en-US'
          });
        }
      });

      // SEO content translations
      const seoContent = {
        pt: {
          title: "Tuggi – Descubra cultura e histórias por onde você passa",
          description: "Explore a cidade com a Tuggi: um app que narra, por áudio e em tempo real, curiosidades culturais e histórias sobre os lugares ao seu redor. Liberdade para caminhar, dirigir e descobrir.",
          keywords: "app de turismo cultural, guia de áudio, histórias locais, curiosidades culturais, exploração urbana, narrativa em tempo real, descoberta de lugares",
          ogTitle: "Tuggi – Descubra cultura e histórias por onde você passa",
          ogDescription: "Explore a cidade com a Tuggi: um app que narra, por áudio e em tempo real, curiosidades culturais e histórias sobre os lugares ao seu redor. Liberdade para caminhar, dirigir e descobrir.",
          ogImageAlt: "Tuggi - App de descoberta cultural e histórias locais",
          locale: "pt_BR"
        },
        en: {
          title: "Tuggi – Discover culture and stories wherever you go",
          description: "Explore the city with Tuggi: an app that narrates, through audio and in real-time, cultural curiosities and stories about the places around you. Freedom to walk, drive and discover.",
          keywords: "cultural tourism app, audio guide, local stories, cultural curiosities, urban exploration, real-time narrative, place discovery",
          ogTitle: "Tuggi – Discover culture and stories wherever you go",
          ogDescription: "Explore the city with Tuggi: an app that narrates, through audio and in real-time, cultural curiosities and stories about the places around you. Freedom to walk, drive and discover.",
          ogImageAlt: "Tuggi - Cultural discovery and local stories app",
          locale: "en_US"
        },
        es: {
          title: "Tuggi – Descubre cultura e historias donde vayas",
          description: "Explora la ciudad con Tuggi: una app que narra, por audio y en tiempo real, curiosidades culturales e historias sobre los lugares a tu alrededor. Libertad para caminar, conducir y descubrir.",
          keywords: "app de turismo cultural, guía de audio, historias locales, curiosidades culturales, exploración urbana, narrativa en tiempo real, descubrimiento de lugares",
          ogTitle: "Tuggi – Descubre cultura e historias donde vayas",
          ogDescription: "Explora la ciudad con Tuggi: una app que narra, por audio y en tiempo real, curiosidades culturales e historias sobre los lugares a tu alrededor. Libertad para caminar, conducir y descubrir.",
          ogImageAlt: "Tuggi - App de descubrimiento cultural e historias locales",
          locale: "es_ES"
        }
      };

      // Function to update SEO content based on language
      function updateSEOContent(lang) {
        const content = seoContent[lang] || seoContent.pt; // default to Portuguese
        
        // Update title
        document.title = content.title;
        
        // Update meta description
        const metaDescription = document.querySelector('meta[name="description"]');
        if (metaDescription) metaDescription.content = content.description;
        
        // Update keywords
        const metaKeywords = document.querySelector('meta[name="keywords"]');
        if (metaKeywords) metaKeywords.content = content.keywords;
        
        // Update Open Graph
        const ogTitle = document.querySelector('meta[property="og:title"]');
        if (ogTitle) ogTitle.content = content.ogTitle;
        
        const ogDescription = document.querySelector('meta[property="og:description"]');
        if (ogDescription) ogDescription.content = content.ogDescription;
        
        const ogImageAlt = document.querySelector('meta[property="og:image:alt"]');
        if (ogImageAlt) ogImageAlt.content = content.ogImageAlt;
        
        const ogLocale = document.querySelector('meta[property="og:locale"]');
        if (ogLocale) ogLocale.content = content.locale;
        
        // Update Twitter Card
        const twitterTitle = document.querySelector('meta[name="twitter:title"]');
        if (twitterTitle) twitterTitle.content = content.ogTitle;
        
        const twitterDescription = document.querySelector('meta[name="twitter:description"]');
        if (twitterDescription) twitterDescription.content = content.ogDescription;
      }

      // Detect and redirect to appropriate language version
      (function() {
        const currentPath = window.location.pathname;
        const pathSegments = currentPath.split('/').filter(Boolean);
        
        // If no language in URL, redirect to appropriate language
        if (pathSegments.length === 0 || !['pt', 'en', 'es'].includes(pathSegments[0])) {
          const browserLang = navigator.language.toLowerCase();
          let targetLang = 'en'; // default
          
          if (browserLang.startsWith('pt')) targetLang = 'pt';
          else if (browserLang.startsWith('es')) targetLang = 'es';
          
          // Check for stored language preference
          const storedLang = localStorage.getItem('tuggi_preferred_language');
          if (storedLang) {
            const langMap = { 'PT': 'pt', 'EN': 'en', 'ES': 'es' };
            targetLang = langMap[storedLang] || targetLang;
          }
          
          // Redirect to localized URL
          const newPath = `/${targetLang}/${pathSegments.join('/')}`;
          if (newPath !== currentPath) {
            window.history.replaceState(null, '', newPath);
          }
        }
        
        // Update SEO content based on current language
        const currentLang = pathSegments[0] || 'pt';
        if (['pt', 'en', 'es'].includes(currentLang)) {
          updateSEOContent(currentLang);
        }
      })();
    </script>
